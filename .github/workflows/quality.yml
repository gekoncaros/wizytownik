name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check app.js
      - name: Required PWA files
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          grep -q 'rel="manifest"' index.html
          grep -q "serviceWorker.register" app.js
